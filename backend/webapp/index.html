<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Signals</title>
  <link rel="icon" type="image/jpeg" href="https://i.ibb.co/5hqTmv23/LOGO.jpg" sizes="32x32">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=13">
  <script src="https://cdn.onesignal.com/sdks/OneSignalSDK.js" async=""></script>
  <script>
    window.OneSignal = window.OneSignal || [];
    OneSignal.push(function() {
      OneSignal.init({
        appId: "YOUR_ONESIGNAL_APP_ID",
        notifyButton: { enable: false },
        allowLocalhostAsSecureOrigin: true
      });
    });
  </script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <div class="logo-lock"><img src="https://i.ibb.co/5hqTmv23/LOGO.jpg" alt="Logo"></div>
        <h1><i class="fas fa-bolt"></i> Crypto Signals</h1>
      </div>
      <div class="header-right">
        <div class="confluence-toggle" title="Multi‑timeframe confluence">
          <label class="switch small">
            <input type="checkbox" id="confluenceToggle">
            <span class="slider"></span>
          </label>
          <span>Confluence</span>
        </div>
        <button id="themeToggle" title="Switch theme"><i class="fas fa-moon"></i></button>
        <span>Auto Trade</span>
        <label class="switch">
          <input type="checkbox" id="autoTradeToggle">
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <div id="ticker"><marquee id="tickerContent">Loading prices...</marquee></div>

    <div class="tabs">
      <button id="tab-signals" class="tab active" onclick="switchTab('signals')"><i class="fas fa-chart-bar"></i> Signals</button>
      <button id="tab-history" class="tab" onclick="switchTab('history')"><i class="fas fa-history"></i> History</button>
      <button id="tab-stats" class="tab" onclick="switchTab('stats')"><i class="fas fa-percent"></i> All Stats</button>
      <button id="tab-1h4h-stats" class="tab" onclick="switchTab('1h4h-stats')"><i class="fas fa-clock"></i> 1h/4h Stats</button>
    </div>

    <section id="signals-section">
      <h2><i class="fas fa-bolt"></i> High Confidence Signals</h2>
      <div id="signalList"></div>
    </section>

    <section id="history-section" style="display: none;">
      <h2><i class="fas fa-clock"></i> Past Signals</h2>
      <div id="historyList"></div>
    </section>

    <section id="stats-section" style="display: none;">
      <h2><i class="fas fa-chart-pie"></i> Performance Stats</h2>
      <div id="statsContent">Loading...</div>
    </section>

    <section id="1h4h-stats-section" style="display: none;">
      <h2><i class="fas fa-chart-pie"></i> 1h/4h Performance</h2>
      <div id="stats1h4hContent">Loading...</div>
    </section>

    <section id="meme-coins">
      <h2><i class="fas fa-coins"></i> New Solana Meme Coins</h2>
      <div id="memeList"></div>
    </section>

    <div id="chartModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <canvas id="priceChart"></canvas>
      </div>
    </div>

    <button id="scrollToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})"><i class="fas fa-arrow-up"></i></button>
  </div>
  <audio id="alertSound" src="https://cdn.jsdelivr.net/npm/@pwabuilder/pwafire@latest/assets/notification.mp3" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
